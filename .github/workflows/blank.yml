set -e

VM_NAME="$VM_NAME"
CPU_CORES="$CPU_CORES"
RAM_SIZE="$RAM_SIZE"
DISK_FILE="$DISK_FILE"

echo ""
echo "╔════════════════════════════════════════════════════════════╗"
echo "║                🚀 INICIANDO PC VIRTUAL COMPLETO...               ║"
echo "╠════════════════════════════════════════════════════════════╣"
echo "║  🖥️  Placa-mãe: ASUS ROG STRIX Z790-A (UEFI)                     ║"
echo "║  ⚙️  CPU: i7-14700K — $CPU_CORES núcleos / 24 threads             ║"
echo "║  📝 RAM: $((RAM_SIZE / 1024))GB DDR5 5600MHz Dual Channel         ║"
echo "║  💾 SSD: 512GB NVMe Kingston KC3000 — 7000/3900 MB/s              ║"
echo "║  🎮 GPU: RTX 3060 12GB GDDR6 — Ray Tracing + DLSS 3              ║"
echo "║  🔌 Fonte: MSI MAG 650W 80+ Bronze — Proteção completa           ║"
echo "║  ❄️  Refrigeração: DeepCool AK400 + Gabinete com 6 fans ARGB      ║"
echo "║  🌐 Rede: 2.5Gbps + Wi-Fi 6E + Bluetooth 5.3                      ║"
echo "║  🔊 Áudio: Realtek ALC4080 — 7.1 canais com DAC                  ║"
echo "╚════════════════════════════════════════════════════════════╝"
echo ""

qemu-system-x86_64 \
  -name "$VM_NAME" \
  -machine type=q35,accel=kvm,usb=pcisecure \
  -cpu host,hv_relaxed,hv_vapic,hv_time,kvm=on,avx2=on,avx512=on \
  -smp $CPU_CORES,cores=$CPU_CORES,threads=2,sockets=1 \
  -m $RAM_SIZE,slots=4,maxmem=131072 \
  -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd \
  -drive file="$DISK_FILE",if=virtio,format=qcow2,cache=none,aio=native,discard=unmap \
  -boot menu=on,order=c,uefi=on \
  -vga none \
  -device virtio-vga,virgl=on,max_outputs=4 \
  -device qemu-xhci,p2=15,p3=15 \
  -device usb-kbd -device usb-tablet \
  -device usb-host,hostbus=1,hostaddr=3 \
  -netdev user,id=net0,hostfwd=tcp::3389-:3389,hostfwd=tcp::2222-:22,hostfwd=tcp::8080-:80,hostfwd=tcp::4443-:443 \
  -device virtio-net-pci,netdev=net0,mac=52:54:00:AB:CD:EF \
  -device ich9-intel-hda -device hda-duplex,audio=driver,spk=on,mic=on \
  -rtc base=localtime,driftfix=slew \
  -balloon virtio,deflate-on-oom=on \
  -object rng-random,filename=/dev/urandom,id=rng0 \
  -device virtio-rng-pci,rng=rng0 \
  -serial mon:stdio \
  -parallel none \
  -daemonize

if [ $? -eq 0 ]; then
