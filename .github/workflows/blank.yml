name: 🖥️ PC Virtual Completo — i7-14ª + RTX 3060
run-name: 🔧 Criando: ${{ github.event.inputs.vm_name }}

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: 'Nome do seu PC Virtual'
        required: false
        default: 'Gamer-Station-Virtual'
      cpu_cores:
        description: 'Núcleos de CPU'
        required: false
        default: '8'
      ram_size:
        description: 'RAM em MB — 16GB = 16384'
        required: false
        default: '16384'
      disk_size:
        description: 'SSD em GB'
        required: false
        default: '512'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-full-pc:
    name: 🛠️ Montar PC Completo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Preparando ambiente
        uses: actions/checkout@v4

      - name: ⚙️ Instalando QEMU e ferramentas
        run: |
          sudo apt-get update -qq && sudo apt-get upgrade -y -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 qemu-img qemu-kvm \
            ovmf edk2-utils virt-manager bridge-utils
          qemu-system-x86_64 --version

      - name: 💿 Criando SSD NVMe Virtual
        run: |
          VM_NAME="${{ github.event.inputs.vm_name || 'Gamer-Station-Virtual' }}"
          DISK_SIZE="${{ github.event.inputs.disk_size || '512' }}"
          DISK_FILE="${VM_NAME// /_}-512GB-NVMe.qcow2"
          qemu-img create -f qcow2 -o preallocation=metadata,cluster_size=65536 "$DISK_FILE" "${DISK_SIZE}G"
          ls -lh "$DISK_FILE"
          echo "DISK_FILE=$DISK_FILE" >> $GITHUB_ENV

      - name: 🎮 Gerando Script de Inicialização COMPLETO
        run: |
          VM_NAME="${{ github.event.inputs.vm_name || 'Gamer-Station-Virtual' }}"
          CPU_CORES="${{ github.event.inputs.cpu_cores || '8' }}"
          RAM_SIZE="${{ github.event.inputs.ram_size || '16384' }}"
          DISK_FILE="${{ env.DISK_FILE }}"
          
          cat > iniciar-pc-completo.sh << 'ENDSCRIPT'
