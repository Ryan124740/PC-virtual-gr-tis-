name: PC Virtual Gamer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar QEMU
        run: |
          sudo apt update -y
          sudo apt install -y qemu-system-x86 qemu-img
          qemu-system-x86_64 --version

      - name: Criar Disco 512GB
        run: |
          qemu-img create -f qcow2 pc-gamer.qcow2 512G
          ls -lh

      - name: Salvar Config
        run: |
          cat > config.txt << 'EOF'
PC VIRTUAL GAMER
=================
Placa-mae: ASUS Z790-A
CPU: i7-14700K
RAM: 16GB DDR5
SSD: 512GB NVMe
GPU: RTX 3060 12GB
Fonte: 650W 80+ Bronze
EOF
          cat config.txt

      - name: Baixar Arquivos
        uses: actions/upload-artifact@v4
        with:
          name: PC-Gamer-Arquivos
          path: |
            *.qcow2
            *.txt
          retention-days: 7
          
